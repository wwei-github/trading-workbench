# ============================================================
# CICD 部署流水线（2026-09-19）
#
# 流程: push main → 测试门禁（tsc + py_compile）→ 变更检测定 scope
#       → SSH 到服务器执行 scripts/release.sh（SHA 构建→up→健康检查→失败自动回滚）
#       → 失败发飞书通知（FEISHU_WEBHOOK 未配置时跳过）
#
# 手动入口: Actions 页面 Run workflow，可指定 scope 重新部署任意最新代码；
#           回滚用服务器上 scripts/release.sh rollback [<sha>]
#
# Secrets:
#   DEPLOY_HOST       服务器 IP
#   DEPLOY_SSH_KEY    部署专用 ed25519 私钥（公钥在服务器 deploy 用户 authorized_keys，
#                     经 command= 包装脚本限制只能执行 deploy <scope> <sha>）
#   FEISHU_APP_ID / FEISHU_APP_SECRET / FEISHU_TARGET_ID
#                     飞书自建应用（部署结果卡片经 open API 发送；
#                     旧 FEISHU_WEBHOOK 自定义机器人已弃用，收不到卡片按钮回调）
# ============================================================
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      scope:
        description: "部署范围"
        type: choice
        default: auto
        options: [auto, backend, frontend, all]
        # auto = 按本次相对上一 commit 的变更自动判断；纯文档 → none（只测试不部署）

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false   # 部署不互相打断，排队执行

jobs:
  # ── 门禁：前端类型检查 + 后端语法检查 ──────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 前端 tsc 类型检查
        run: |
          cd frontend
          npm ci
          npx tsc --noEmit

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 后端语法检查（compileall）
        run: python -m compileall -q backend/app

  # ── 变更检测：决定部署范围（backend|frontend|all|none）──────
  changes:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    outputs:
      scope: ${{ steps.diff.outputs.scope }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 需要与上一个 commit 做 diff
      - id: diff
        name: 计算变更范围
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [[ "$BEFORE" =~ ^0+$ ]]; then
            echo "scope=all" >> "$GITHUB_OUTPUT"   # 首次 push / 历史不明 → 全量
          else
            CHANGED=$(git diff --name-only "$BEFORE" HEAD || true)
            echo "变更文件:"; echo "$CHANGED" | head -50
            scope=none
            if echo "$CHANGED" | grep -qE '^(docker-compose\.yml|backend/\.env\.example|scripts/release\.sh)$|^(backend|frontend)/Dockerfile'; then
              scope=all
            else
              if echo "$CHANGED" | grep -q '^backend/';   then scope=backend; fi
              if echo "$CHANGED" | grep -q '^frontend/';  then scope=all; fi
            fi
            # 只有 .github/、docs/、*.md 等变更 → none（已通过测试，不部署）
            echo "scope=$scope" >> "$GITHUB_OUTPUT"
          fi

  # ── 发布：SSH 到服务器执行 release.sh ──────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: [test, changes]
    if: >
      always() &&
      needs.test.result == 'success' &&
      (github.event_name == 'workflow_dispatch' || needs.changes.outputs.scope != 'none')
    outputs:
      scope: ${{ steps.prep.outputs.scope }}
    steps:
      - id: prep
        name: 确定部署 scope
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            s="${{ inputs.scope }}"
            [ "$s" == "auto" ] && s=all     # 手动触发无法 diff，默认全量
          else
            s="${{ needs.changes.outputs.scope }}"
          fi
          echo "scope=$s" >> "$GITHUB_OUTPUT"
          echo "部署 scope: $s"

      - name: 写入部署私钥
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: SSH 发布（受限通道 deploy@：包装脚本只接受 deploy <scope> <sha>，见服务器 /usr/local/bin/deploy-run.sh）
        id: ssh_deploy
        run: |
          set -o pipefail
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=15 \
              deploy@${{ secrets.DEPLOY_HOST }} \
              "deploy ${{ steps.prep.outputs.scope }} ${{ github.sha }}" \
          2>&1 | tee deploy_output.log
          # release.sh 失败会非零退出，pipefail 让本步骤失败

      # 飞书通知（消息卡片）：成功/失败都发。要点：
      # - always() 保证前面步骤失败也执行；send 步骤本身不 fail（通知失败不阻塞流水线）
      # - 卡片：头部绿/红随结果，fields 两列栅格放元信息，失败附回退提示 + 日志尾部（纯文本不解析）
      # - 成功从日志提取 release.sh 的 DEPLOY_OK 行，短 SHA 便于和 release.sh status 对账
      - name: 飞书通知（成功/失败）
        if: always()
        env:
          APP_ID: ${{ secrets.FEISHU_APP_ID }}
          APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          TARGET_ID: ${{ secrets.FEISHU_TARGET_ID }}
          SCOPE: ${{ steps.prep.outputs.scope }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          MSG: ${{ github.event.head_commit.message }}
          REF: ${{ github.ref_name }}
          RESULT: ${{ steps.ssh_deploy.outcome }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_SECRET" ] || [ -z "$TARGET_ID" ]; then
            echo "未配置飞书自建应用三件套，跳过通知"; exit 0
          fi
          LOG=$(tail -c 1200 deploy_output.log 2>/dev/null || echo "（无部署日志）")
          OK_LINE=$(grep -E 'DEPLOY_OK|ROLLED_BACK_TO' deploy_output.log 2>/dev/null | tail -1 || true)
          SCOPE="$SCOPE" SHA="$SHA" ACTOR="$ACTOR" MSG="$MSG" REF="$REF" \
          RESULT="$RESULT" LOG="$LOG" OK_LINE="$OK_LINE" \
          APP_ID="$APP_ID" APP_SECRET="$APP_SECRET" TARGET_ID="$TARGET_ID" python3 - <<'PY'
          import json, os, urllib.request
          e = os.environ
          short = e['SHA'][:7]
          msg = (e['MSG'] or '').splitlines()[0][:60] if e['MSG'] else ''
          ok = e['RESULT'] == 'success'
          fields = [
              {"is_short": True, "text": {"tag": "lark_md",
               "content": f"**版本**　{short}（{e['REF']}）"}},
              {"is_short": True, "text": {"tag": "lark_md",
               "content": f"**范围**　{e['SCOPE']}"}},
              {"is_short": True, "text": {"tag": "lark_md",
               "content": f"**触发**　{e['ACTOR']}"}},
              {"is_short": True, "text": {"tag": "lark_md",
               "content": f"**提交**　{msg or '—'}"}},
          ]
          elements = [{"tag": "div", "fields": fields}]
          if ok:
              elements += [
                  {"tag": "hr"},
                  {"tag": "div", "text": {"tag": "lark_md",
                   "content": f"<font color='success'>✔</font> {e['OK_LINE'] or '健康检查全部通过'}"}},
              ]
          else:
              elements += [
                  {"tag": "hr"},
                  {"tag": "div", "text": {"tag": "lark_md",
                   "content": ("<font color='red'>✖</font> 构建失败→旧容器未动；"
                               "up 后失败→已自动回滚\n"
                               "回退：服务器执行 `scripts/release.sh rollback [<sha>]`")}},
                  {"tag": "div", "text": {"tag": "plain_text", "content": "---- 部署日志尾部 ----\n" + e['LOG']}},
              ]
          card = {
              "config": {"wide_screen_mode": True},
              "header": {
                  "title": {"tag": "plain_text",
                            "content": ("✅ 部署成功" if ok else "❌ 部署失败") + " · trading-workbench"},
                  "template": "green" if ok else "red",
              },
              "elements": elements,
          }

          def post(url, payload, headers, timeout=10):
              req = urllib.request.Request(url, data=json.dumps(payload).encode(), headers=headers)
              return json.load(urllib.request.urlopen(req, timeout=timeout))

          OPEN = "https://open.feishu.cn/open-apis"
          try:
              # 自建应用发送：tenant_access_token → im/v1/messages
              # TARGET_ID 前缀识别目标类型：oc_ 群（chat_id）/ ou_ 个人（open_id）
              tok = post(f"{OPEN}/auth/v3/tenant_access_token/internal",
                         {"app_id": e['APP_ID'], "app_secret": e['APP_SECRET']},
                         {"Content-Type": "application/json"})
              if tok.get("code") != 0:
                  print(f"获取 tenant_access_token 失败（不阻塞）: {str(tok)[:200]}")
              else:
                  rid_type = "chat_id" if e['TARGET_ID'].startswith("oc_") else "open_id"
                  r = post(f"{OPEN}/im/v1/messages?receive_id_type={rid_type}",
                           {"receive_id": e['TARGET_ID'], "msg_type": "interactive",
                            "content": json.dumps(card, ensure_ascii=False)},
                           {"Content-Type": "application/json",
                            "Authorization": f"Bearer {tok['tenant_access_token']}"})
                  if r.get("code") != 0:
                      print(f"部署通知发送失败（不阻塞）: {str(r)[:300]}")
          except Exception as ex:
              print(f"飞书通知发送失败（不阻塞）: {ex}")
          PY

      - name: 部署结果摘要
        if: success()
        run: |
          echo "### 部署成功 ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "- 范围: ${{ steps.prep.outputs.scope }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- 版本: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          grep -E 'DEPLOY_OK|健康检查' deploy_output.log | tail -3 >> "$GITHUB_STEP_SUMMARY" || true
