# ============================================================
# CICD 部署流水线（2026-09-19）
#
# 流程: push main → 测试门禁（tsc + py_compile）→ 变更检测定 scope
#       → SSH 到服务器执行 scripts/release.sh（SHA 构建→up→健康检查→失败自动回滚）
#       → 失败发飞书通知（FEISHU_WEBHOOK 未配置时跳过）
#
# 手动入口: Actions 页面 Run workflow，可指定 scope 重新部署任意最新代码；
#           回滚用服务器上 scripts/release.sh rollback [<sha>]
#
# Secrets:
#   DEPLOY_HOST       服务器 IP
#   DEPLOY_SSH_KEY    部署专用 ed25519 私钥（公钥在服务器 deploy 用户 authorized_keys，
#                     经 command= 包装脚本限制只能执行 deploy <scope> <sha>）
#   FEISHU_APP_ID / FEISHU_APP_SECRET / FEISHU_TARGET_ID
#                     飞书自建应用（部署结果卡片经 open API 发送；
#                     旧 FEISHU_WEBHOOK 自定义机器人已弃用，收不到卡片按钮回调）
# ============================================================
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      scope:
        description: "部署范围"
        type: choice
        default: auto
        options: [auto, backend, frontend, all]
        # auto = 按本次相对上一 commit 的变更自动判断
        # 文档类变更（docs/、docs-wiki/、wiki 生成器）→ frontend（wiki 随前端 dist 发布）

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false   # 部署不互相打断，排队执行

jobs:
  # ── 门禁：前端类型检查 + 后端语法检查 ──────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 前端 tsc 类型检查
        run: |
          cd frontend
          npm ci
          npx tsc --noEmit

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 后端语法检查（compileall）
        run: python -m compileall -q backend/app

  # ── 变更检测：决定部署范围（backend|frontend|all|none）──────
  changes:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    outputs:
      scope: ${{ steps.diff.outputs.scope }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 需要与上一个 commit 做 diff
      - id: diff
        name: 计算变更范围
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [[ "$BEFORE" =~ ^0+$ ]]; then
            echo "scope=all" >> "$GITHUB_OUTPUT"   # 首次 push / 历史不明 → 全量
          else
            CHANGED=$(git diff --name-only "$BEFORE" HEAD || true)
            echo "变更文件:"; echo "$CHANGED" | head -50
            scope=none
            if echo "$CHANGED" | grep -qE '^(docker-compose\.yml|backend/\.env\.example|scripts/release\.sh)$|^(backend|frontend)/Dockerfile'; then
              scope=all
            else
              if echo "$CHANGED" | grep -q '^backend/';   then scope=backend; fi
              if echo "$CHANGED" | grep -q '^frontend/';  then scope=all; fi
              # 文档类变更（2026-10-18）：docs/（含 CODE_WIKI、技术文档、流程文档）、
              # docs-wiki/（wiki 页面手写源）与 wiki 生成器 → 部署 frontend。
              # 原因：wiki 内容被 build_docs_wiki.mjs 生成后并入 frontend/dist 随站点
              # 发布于 /wiki/，且 release.sh 的 bundle 模式强制要求完整 dist/index.html，
              # 故必须走前端全量构建路径（wiki 生成本身仍是增量：只重生成变更篇目）。
              # 与 frontend 规则同构地向上取档，只提升不降级：
              #   none → frontend（纯文档）；backend → all（后端也在改，两边都要发）；
              #   frontend/all → 保持不变。
              if echo "$CHANGED" | grep -qE '^(docs/|docs-wiki/)|^scripts/build_docs_wiki\.mjs$'; then
                case "$scope" in   # 三态映射写在一处，避免条件式赋值把档位判断拆散
                  none)    scope=frontend ;;
                  backend) scope=all ;;
                esac
              fi
            fi
            # 只有 .github/、根级 *.md 等变更 → none（已通过测试，不部署）
            echo "scope=$scope" >> "$GITHUB_OUTPUT"
          fi

  # ── 发布：SSH 到服务器执行 release.sh ──────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: [test, changes]
    if: >
      always() &&
      needs.test.result == 'success' &&
      (github.event_name == 'workflow_dispatch' || needs.changes.outputs.scope != 'none')
    outputs:
      scope: ${{ steps.prep.outputs.scope }}
    steps:
      - uses: actions/checkout@v4

      - id: prep
        name: 确定部署 scope
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            s="${{ inputs.scope }}"
            [ "$s" == "auto" ] && s=all     # 手动触发无法 diff，默认全量
          else
            s="${{ needs.changes.outputs.scope }}"
          fi
          echo "scope=$s" >> "$GITHUB_OUTPUT"
          echo "部署 scope: $s"

      # 前端构建外移（2026-10-12）：1.6G 内存服务器无法完成含 mermaid 的
      # vite build（峰值 ~2.3GB，连续两次部署卡死 2h+ 后 SSH 断连失败）。
      # 改在 runner 构建 dist → tar.gz，经部署通道以 stdin 传入服务器，
      # 服务器解压后仅做镜像打包（frontend/Dockerfile 只 COPY dist，秒级）。
      - uses: actions/setup-node@v4
        if: steps.prep.outputs.scope != 'backend'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # NODE_OPTIONS 抬高堆上限（2026-10-16）：runner 侧 vite build（含 mermaid）
      # 峰值贴 Node 20 默认 ~2GB old-space 帽，rendering chunks 阶段偶发
      # "JavaScript heap out of memory"（exit 134，run 38850324395）。抬到 4GB 留余量。
      #
      # docs wiki（2026-10-18）：由 frontend 的 prebuild 钩子（scripts/sync-wiki.mjs）完成——
      # 增量生成 docs/ → docs-wiki/ 并发布到 frontend/public/wiki/，再由 vite 拷入 dist。
      # 这里不再单独跑生成器或手写 cp：生成/发布规则收在一处，dev 与 build 同路径。
      - name: 构建前端产物
        if: steps.prep.outputs.scope != 'backend'
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          cd frontend
          npm ci --no-audit --no-fund
          npm run build

      - name: 打包前端产物（dist.tar.gz）
        if: steps.prep.outputs.scope != 'backend'
        run: |
          tar -czf "$RUNNER_TEMP/frontend_dist.tar.gz" -C frontend dist
          ls -lh "$RUNNER_TEMP/frontend_dist.tar.gz"

      - name: 写入部署私钥
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: SSH 发布（受限通道 deploy@：包装脚本只接受 deploy <scope> <sha> [bundle]，见服务器 /usr/local/bin/deploy-run.sh）
        id: ssh_deploy
        env:
          SCOPE: ${{ steps.prep.outputs.scope }}
          BUNDLE: ${{ runner.temp }}/frontend_dist.tar.gz
        run: |
          set -o pipefail
          SSH_CMD=(ssh -i ~/.ssh/deploy_key
                   -o StrictHostKeyChecking=accept-new
                   -o ConnectTimeout=15
                   deploy@${{ secrets.DEPLOY_HOST }})
          if [ "$SCOPE" != "backend" ]; then
            # bundle 模式：stdin 传前端 dist 产物，服务器解压后仅打包镜像
            "${SSH_CMD[@]}" "deploy $SCOPE ${{ github.sha }} bundle" < "$BUNDLE" 2>&1 | tee deploy_output.log
          else
            "${SSH_CMD[@]}" "deploy $SCOPE ${{ github.sha }}" 2>&1 | tee deploy_output.log
          fi
          # release.sh 失败会非零退出，pipefail 让本步骤失败

      # 飞书通知（消息卡片）：成功/失败都发。要点：
      # - always() 保证前面步骤失败也执行；send 步骤本身不 fail（通知失败不阻塞流水线）
      # - 卡片：头部绿/红随结果，fields 两列栅格放元信息，失败附回退提示 + 日志尾部（纯文本不解析）
      # - 成功从日志提取 release.sh 的 DEPLOY_OK 行，短 SHA 便于和 release.sh status 对账
      - name: 飞书通知（成功/失败）
        if: always()
        env:
          APP_ID: ${{ secrets.FEISHU_APP_ID }}
          APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          TARGET_ID: ${{ secrets.FEISHU_TARGET_ID }}
          SCOPE: ${{ steps.prep.outputs.scope }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          MSG: ${{ github.event.head_commit.message }}
          REF: ${{ github.ref_name }}
          RESULT: ${{ steps.ssh_deploy.outcome }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_SECRET" ] || [ -z "$TARGET_ID" ]; then
            echo "未配置飞书自建应用三件套，跳过通知"; exit 0
          fi
          LOG=$(tail -c 1200 deploy_output.log 2>/dev/null || echo "（无部署日志）")
          OK_LINE=$(grep -E 'DEPLOY_OK|ROLLED_BACK_TO' deploy_output.log 2>/dev/null | tail -1 || true)
          SCOPE="$SCOPE" SHA="$SHA" ACTOR="$ACTOR" MSG="$MSG" REF="$REF" \
          RESULT="$RESULT" LOG="$LOG" OK_LINE="$OK_LINE" \
          APP_ID="$APP_ID" APP_SECRET="$APP_SECRET" TARGET_ID="$TARGET_ID" python3 - <<'PY'
          import json, os, urllib.request
          e = os.environ
          short = e['SHA'][:7]
          msg = (e['MSG'] or '').splitlines()[0][:60] if e['MSG'] else ''
          ok = e['RESULT'] == 'success'
          fields = [
              {"is_short": True, "text": {"tag": "lark_md",
               "content": f"**版本**　{short}（{e['REF']}）"}},
              {"is_short": True, "text": {"tag": "lark_md",
               "content": f"**范围**　{e['SCOPE']}"}},
              {"is_short": True, "text": {"tag": "lark_md",
               "content": f"**触发**　{e['ACTOR']}"}},
              {"is_short": True, "text": {"tag": "lark_md",
               "content": f"**提交**　{msg or '—'}"}},
          ]
          elements = [{"tag": "div", "fields": fields}]
          if ok:
              elements += [
                  {"tag": "hr"},
                  {"tag": "div", "text": {"tag": "lark_md",
                   "content": f"<font color='success'>✔</font> {e['OK_LINE'] or '健康检查全部通过'}"}},
              ]
          else:
              elements += [
                  {"tag": "hr"},
                  {"tag": "div", "text": {"tag": "lark_md",
                   "content": ("<font color='red'>✖</font> 构建失败→旧容器未动；"
                               "up 后失败→已自动回滚\n"
                               "回退：服务器执行 `scripts/release.sh rollback [<sha>]`")}},
                  {"tag": "div", "text": {"tag": "plain_text", "content": "---- 部署日志尾部 ----\n" + e['LOG']}},
              ]
          card = {
              "config": {"wide_screen_mode": True},
              "header": {
                  "title": {"tag": "plain_text",
                            "content": ("✅ 部署成功" if ok else "❌ 部署失败") + " · trading-workbench"},
                  "template": "green" if ok else "red",
              },
              "elements": elements,
          }

          def post(url, payload, headers, timeout=10):
              req = urllib.request.Request(url, data=json.dumps(payload).encode(), headers=headers)
              return json.load(urllib.request.urlopen(req, timeout=timeout))

          OPEN = "https://open.feishu.cn/open-apis"
          try:
              # 自建应用发送：tenant_access_token → im/v1/messages
              # TARGET_ID 前缀识别目标类型：oc_ 群（chat_id）/ ou_ 个人（open_id）
              tok = post(f"{OPEN}/auth/v3/tenant_access_token/internal",
                         {"app_id": e['APP_ID'], "app_secret": e['APP_SECRET']},
                         {"Content-Type": "application/json"})
              if tok.get("code") != 0:
                  print(f"获取 tenant_access_token 失败（不阻塞）: {str(tok)[:200]}")
              else:
                  rid_type = "chat_id" if e['TARGET_ID'].startswith("oc_") else "open_id"
                  r = post(f"{OPEN}/im/v1/messages?receive_id_type={rid_type}",
                           {"receive_id": e['TARGET_ID'], "msg_type": "interactive",
                            "content": json.dumps(card, ensure_ascii=False)},
                           {"Content-Type": "application/json",
                            "Authorization": f"Bearer {tok['tenant_access_token']}"})
                  if r.get("code") != 0:
                      print(f"部署通知发送失败（不阻塞）: {str(r)[:300]}")
          except Exception as ex:
              print(f"飞书通知发送失败（不阻塞）: {ex}")
          PY

      - name: 部署结果摘要
        if: success()
        run: |
          echo "### 部署成功 ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "- 范围: ${{ steps.prep.outputs.scope }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- 版本: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          grep -E 'DEPLOY_OK|健康检查' deploy_output.log | tail -3 >> "$GITHUB_STEP_SUMMARY" || true

  # ── 门禁失败通知（2026-09-23）──────────────────────────────
  # 背景：飞书通知在 deploy job 内，而 deploy 条件含 needs.test.result == 'success'
  # —— test 门禁失败时 deploy 整个被 skip，通知步骤不会执行（失败静默）。
  # 本 job 独立于 deploy：仅在 test/changes 失败时发卡片；deploy 失败仍由上方通知（不重复）。
  notify-gate-failure:
    runs-on: ubuntu-latest
    needs: [test, changes]
    if: always() && (needs.test.result == 'failure' || needs.changes.result == 'failure')
    steps:
      - name: 飞书通知（门禁失败）
        env:
          APP_ID: ${{ secrets.FEISHU_APP_ID }}
          APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          TARGET_ID: ${{ secrets.FEISHU_TARGET_ID }}
          SHA: ${{ github.sha }}
          MSG: ${{ github.event.head_commit.message }}
          REF: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          TEST: ${{ needs.test.result }}
          CHANGES: ${{ needs.changes.result }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_SECRET" ] || [ -z "$TARGET_ID" ]; then
            echo "未配置飞书自建应用三件套，跳过通知"; exit 0
          fi
          TEST="$TEST" CHANGES="$CHANGES" SHA="$SHA" MSG="$MSG" REF="$REF" ACTOR="$ACTOR" \
          APP_ID="$APP_ID" APP_SECRET="$APP_SECRET" TARGET_ID="$TARGET_ID" python3 - <<'PY'
          import json, os, urllib.request
          e = os.environ
          short = e['SHA'][:7]
          msg = (e['MSG'] or '').splitlines()[0][:60] if e['MSG'] else ''
          test, changes = e['TEST'], e['CHANGES']
          gate = '前端 tsc / 后端 compileall' if test == 'failure' else '变更检测'
          failed_jobs = [n for n, r in (('test 门禁', test), ('变更检测', changes)) if r == 'failure']
          card = {
              "config": {"wide_screen_mode": True},
              "header": {"title": {"tag": "plain_text",
                        "content": "❌ 门禁失败 · trading-workbench"},
                        "template": "red"},
              "elements": [
                  {"tag": "div", "fields": [
                      {"is_short": True, "text": {"tag": "lark_md", "content": f"**版本**　{short}（{e['REF']}）"}},
                      {"is_short": True, "text": {"tag": "lark_md", "content": f"**触发**　{e['ACTOR']}"}},
                      {"is_short": True, "text": {"tag": "lark_md", "content": f"**提交**　{msg or '—'}"}},
                      {"is_short": True, "text": {"tag": "lark_md", "content": f"**失败**　{gate}"}},
                  ]},
                  {"tag": "hr"},
                  {"tag": "div", "text": {"tag": "lark_md",
                   "content": "代码未部署，线上仍在跑旧版本。日志见 GitHub Actions。"}},
                  {"tag": "note", "elements": [{"tag": "plain_text",
                   "content": f"job 状态: {'、'.join(failed_jobs)}；changes={changes or 'skipped'}"}]},
              ],
          }

          def post(url, payload, headers, timeout=10):
              req = urllib.request.Request(url, data=json.dumps(payload).encode(), headers=headers)
              return json.load(urllib.request.urlopen(req, timeout=timeout))

          OPEN = "https://open.feishu.cn/open-apis"
          try:
              tok = post(f"{OPEN}/auth/v3/tenant_access_token/internal",
                         {"app_id": e['APP_ID'], "app_secret": e['APP_SECRET']},
                         {"Content-Type": "application/json"})
              if tok.get("code") != 0:
                  print(f"获取 tenant_access_token 失败（不阻塞）: {str(tok)[:200]}")
              else:
                  rid_type = "chat_id" if e['TARGET_ID'].startswith("oc_") else "open_id"
                  r = post(f"{OPEN}/im/v1/messages?receive_id_type={rid_type}",
                           {"receive_id": e['TARGET_ID'], "msg_type": "interactive",
                            "content": json.dumps(card, ensure_ascii=False)},
                           {"Content-Type": "application/json",
                            "Authorization": f"Bearer {tok['tenant_access_token']}"})
                  if r.get("code") != 0:
                      print(f"门禁失败通知发送失败（不阻塞）: {str(r)[:300]}")
          except Exception as ex:
              print(f"飞书通知发送失败（不阻塞）: {ex}")
          PY
