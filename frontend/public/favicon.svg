<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2833"/>
      <stop offset="1" stop-color="#0a1118"/>
    </linearGradient>
    <radialGradient id="glow-bg" cx="0.22" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#3d5568" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#1c2833" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="green" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0a9e63"/>
      <stop offset="1" stop-color="#17d98c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#d99e06"/>
      <stop offset="1" stop-color="#f8ce3c"/>
    </linearGradient>
    <filter id="gold-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <rect width="64" height="64" rx="15" fill="url(#glow-bg)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="14.25"
        fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1.5"/>

  <line x1="10" y1="56.5" x2="54" y2="56.5" stroke="#2a3b4a" stroke-width="1.5" stroke-linecap="round"/>

  <line x1="18" y1="34" x2="18" y2="53" stroke="#0a9e63" stroke-width="2.4" stroke-linecap="round"/>
  <rect x="12.5" y="40.5" width="11" height="9" rx="2.6" fill="url(#green)"/>

  <line x1="32" y1="24" x2="32" y2="49" stroke="#0a9e63" stroke-width="2.4" stroke-linecap="round"/>
  <rect x="26.5" y="28.5" width="11" height="14" rx="2.6" fill="url(#green)"/>

  <line x1="46" y1="9" x2="46" y2="44" stroke="#c78f05" stroke-width="2.4" stroke-linecap="round"/>
  <rect x="40.5" y="13" width="11" height="23" rx="2.6" fill="url(#gold)" filter="url(#gold-glow)"/>
</svg>
