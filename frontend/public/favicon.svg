<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 深色终端底：左上到右下微渐变 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2530"/>
      <stop offset="1" stop-color="#0a1118"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0a9e63"/>
      <stop offset="1" stop-color="#17d98c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#d99e06"/>
      <stop offset="1" stop-color="#f8ce3c"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- 内侧高光描边，增加质感 -->
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25"
        fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>

  <!-- 三根上行 K 线：渐进抬高，末根金色为焦点 -->
  <!-- K1（矮）-->
  <line x1="17" y1="37" x2="17" y2="56" stroke="#0a9e63" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="11.5" y="43" width="11" height="9" rx="2.5" fill="url(#green)"/>
  <!-- K2（中）-->
  <line x1="32" y1="26" x2="32" y2="50" stroke="#0a9e63" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="26.5" y="30" width="11" height="14" rx="2.5" fill="url(#green)"/>
  <!-- K3（高·金）-->
  <line x1="47" y1="10" x2="47" y2="45" stroke="#c78f05" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="41.5" y="14" width="11" height="22" rx="2.5" fill="url(#gold)"/>
</svg>
