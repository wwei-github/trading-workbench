server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 用 Docker 内置 DNS 动态解析 backend，避免 backend 容器重建换 IP 后 502
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        try_files $uri $uri/ /index.html;
        # HTML 入口（含 SPA 路由 fallback 出的 index.html）禁缓存：发版后浏览器
        # 立即拿到新入口、引用新 hash 的 JS。否则启发式缓存会让用户滞留旧包
        # （案例：旧包 InputNumber min=1，输入 0 失焦被钳成 1 保存入库）
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # 带 content hash 的静态资源：内容变→文件名变→URL 变，可放心长缓存
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
        # proxy_pass 中使用变量，nginx 默认对变量式 proxy_pass 走 HTTP/1.0 并缓冲响应，
        # SSE 长连接必须显式开 1.1 + 关缓冲，否则事件会被攒批/掐断
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        # proxy_pass 中使用变量，nginx 每次请求时重新解析主机名
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 手动搜索等同步 AI 分析耗时可达数分钟，nginx 默认 60s 会提前掐断返回 504
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
