services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trading_workbench
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    # CICD（2026-09-19）：镜像带 IMAGE_TAG（默认 latest），发布脚本按 git SHA 打标签，
    # 回滚 = 切标签 + up -d，无需重新构建。不设 IMAGE_TAG 时行为与旧手动部署一致
    image: trading-workbench-backend:${IMAGE_TAG:-latest}
    env_file:
      - ./backend/.env
    ports:
      - "8082:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery_worker:
    build: ./backend
    image: trading-workbench-backend:${IMAGE_TAG:-latest}
    env_file:
      - ./backend/.env
    # 并发 10：LLM 信号量 LLM_CONCURRENCY=8 + 预留 2 空位给即时开仓等短任务，
    # 不至于排在分钟级分析任务后面失去时效（任务以 LLM 网络等待为主，I/O 型）
    command: celery -A celery_worker.celery_app worker --loglevel=info --concurrency=10
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery_beat:
    build: ./backend
    image: trading-workbench-backend:${IMAGE_TAG:-latest}
    env_file:
      - ./backend/.env
    command: celery -A celery_worker.celery_app beat --loglevel=info -s /var/lib/celery/beat-schedule
    # schedule 文件持久化（2026-10-13）：默认容器内路径随容器重建丢失 last_run_at，
    # 结构盯盘等周期任务会漏跑；挂到 named volume 后重建保留，错过的整点按
    # crontab 语义补发一次
    volumes:
      - beatstate:/var/lib/celery
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: trading-workbench-frontend:${IMAGE_TAG:-latest}
    ports:
      - "8088:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  beatstate:
